[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terzaghi"
version = "1.2.0"
description = "Geotecnia y cimentaciones en Python: capacidad portante EN 1997-1 Anexo D (excentricidad, inclinación, nivel freático, DA1/DA2), pilotes (α/β, curvas p-y, grupos, monopilotes), consolidación con drenes, licuefacción Boulanger-Idriss 2014, respuesta de sitio 1D multicapa (Kramer 1996), muelles de Gazetas, muros de gaviones, Mononobe-Okabe, túneles, durabilidad, AGS4→PLAXIS y API REST."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["geotechnical-engineering", "bearing-capacity", "eurocode-7", "p-y-curves", "piles", "pile-group", "liquefaction", "boulanger-idriss", "consolidation", "vertical-drains", "soil-structure-interaction", "gazetas", "site-response", "retaining-wall", "mononobe-okabe", "tunnel", "ags4", "plaxis", "loadpath"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26", "pydantic>=2.0", "forallpeople>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
memos = ["handcalcs>=1.6"]
test = ["pytest>=8", "pytest-timeout>=2.2"]

[project.urls]
Homepage = "https://github.com/jmurgass99/terzaghi"
Repository = "https://github.com/jmurgass99/terzaghi"
Issues = "https://github.com/jmurgass99/terzaghi/issues"

[tool.setuptools.packages.find]
include = ["terzaghi*"]

[tool.setuptools.package-data]
terzaghi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "safety_critical: validados contra valores publicados",
]
