[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geojm"
version = "0.1.0"
description = "Geotecnia y fundaciones — P-y curves, SSI, Mander"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "forallpeople>=2.6",
    "jmstructural-common",
    # `geojm.bearing_capacity` importa foundationdesignjm A NIVEL DE MODULO
    # (delega la capacidad portante en la canonica). Funcionaba sin declararlo
    # solo porque el venv del workspace instala todo; instalado suelto rompia.
    "foundationdesignjm",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["geojm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "characterization: fija la salida ACTUAL de la implementacion, no un valor publicado",
]

[tool.uv.sources]
jmstructural-common = { workspace = true }
foundationdesignjm = { workspace = true }
